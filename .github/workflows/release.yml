name: Verify release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Verify version and built assets
        run: |
          python3 - <<'CHECK'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          header = Path('hm-post-history.php').read_text()
          assert re.search(r'Version:\s*' + re.escape(version) + r'\s', header), 'Plugin version does not match tag'
          assert json.loads(Path('package.json').read_text())['version'] == version, 'Package version does not match tag'
          build = Path('assets/build')
          manifest = json.loads((build / 'production-asset-manifest.json').read_text())
          assert {'browser.js', 'browser.css'} <= manifest.keys(), 'History assets are missing'
          for filename in manifest.values():
              assert (build / filename).is_file(), f'Missing built asset: {filename}'
          print(f'Verified immutable release {version}')
          CHECK
